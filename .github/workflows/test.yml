name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gptodo is installed so the drift test against its canonical states runs.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install "git+https://github.com/gptme/gptme-contrib.git#subdirectory=packages/gptodo"
      - name: Run tests
        run: python -m pytest tests -v
